name: Fatoş Emoji Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'fatos_emoji_akli.py'
      - 'fatos_conversation_runtime.py'
      - 'test_fatos_emoji_akli.py'
      - '.github/workflows/fatos-emoji-acceptance.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fatos-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emoji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run emoji acceptance
        run: python test_fatos_emoji_akli.py