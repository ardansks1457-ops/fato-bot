name: Fatoş System Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Show runtime
        run: python --version
      - name: Run dependency-free hardening regression
        run: python test_fatos_system_hardening.py
