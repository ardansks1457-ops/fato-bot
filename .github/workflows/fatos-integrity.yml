name: Fatos Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fatos-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q .
      - name: Dependency smoke test
        run: python -c "import aiohttp, aiosqlite, aiogram, pydantic, pytz; print('Dependencies OK')"
      - name: Project integrity
        run: python project_integrity_check.py
      - name: 90-point acceptance
        run: python test_fatos_90point.py
