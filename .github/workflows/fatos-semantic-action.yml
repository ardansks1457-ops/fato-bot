name: Fatoş Semantic Action Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fatos-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pip aiosqlite pytest pytest-asyncio
      - name: Run adaptive confidence test
        run: python test_fatos_adaptive_confidence.py
      - name: Run semantic action test
        run: python test_fatos_semantic_action_engine.py
      - name: Run get_response bridge regression
        run: python -m pytest -q test_fatos_get_response_bridge.py