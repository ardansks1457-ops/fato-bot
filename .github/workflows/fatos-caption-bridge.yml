name: Fatoş Telegram Caption Bridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fatos-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  caption-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip aiogram aiosqlite
      - name: Verify caption bridge
        run: python test_fatos_telegram_caption_bridge.py