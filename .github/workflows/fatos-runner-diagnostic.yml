name: Fatoş Runner Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner reached
        run: echo "FATOS_RUNNER_REACHED"
      - name: Python check
        run: python --version
      - name: Git check
        run: git --version
